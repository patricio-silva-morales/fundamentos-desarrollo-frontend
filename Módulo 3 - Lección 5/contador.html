<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo de contador</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        
        <button onclick="aumentar();">Aumentar</button>
        <button onclick="disminuir();">Disminuir</button>

        <p id="resultado">0</p>

        <script>
            // Variable global: Se declara e inicializa
            let contador = 0;

            function aumentar(){
                // Aumenta en una unidad el valor almacenado
                contador++;

                mostrar_valor_contador();
            }

            function disminuir(){
                // Disminuye en una unidad el valor almacenado
                contador--;

                mostrar_valor_contador();
            }

            function mostrar_valor_contador() {
                document.getElementById("resultado").textContent = contador;
            }
            
        </script>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
