<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma de dos números</title>
</head>
<body>

    <h1>Sumar dos números</h1>

    <input type="number" id="numero1" placeholder="Ingrese el primer número">
    <input type="number" id="numero2" placeholder="Ingrese el segundo número">

    <button onclick="sumar()">Sumar</button>

    <p id="resultado"></p>

    <script>
        function sumar() {
            let n1 = Number(document.getElementById("numero1").value);
            let n2 = Number(document.getElementById("numero2").value);

            let suma = n1 + n2;

            document.getElementById("resultado").innerHTML = "El resultado es: " + suma;
        }
    </script>

</body>
</html>
