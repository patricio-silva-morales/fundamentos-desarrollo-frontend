<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Ejemplo de ciclo</title>
    </head>
    <body>
        <button onclick="recorrer();">Ejecutar</button>

        <script>
            function recorrer() {
                let i; 
                
                for(i=1; i <= 10; i++) {
                    console.log(`Iteración #${i}`);
                }

                console.log(`Valor de salida del contador: ${i}`);
            }
        </script>
    </body>
</html>
